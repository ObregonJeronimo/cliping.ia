    // en coordenadas de capa es (0,0)-(ancho,alto), igual que la geometria que se le arma arriba
    const dm = doc.capas.find(c => c.indice === capa.matte.de)
    if (!dm || !dm.solido) { cerrar(planos); return }
    const M = _mRec.copy(PHI).multiply(matrizDe(dm.indice, t))
    const q = [[0, 0], [dm.solido.ancho, 0], [dm.solido.ancho, dm.solido.alto], [0, dm.solido.alto]]
      .map(([x, y]) => new THREE.Vector3(x, y, 0).applyMatrix4(M))

    // EL AREA SE MIDE ANTES DE NORMALIZAR, y esa es la unica forma de que la guarda sirva. La version
    // anterior preguntaba `lengthSq() < 1e-12` DESPUES de `.normalize()`, donde el valor es 1 o 0
    // exacto: no podia dispararse nunca por orientacion. Con la matte girada 90 grados en Y, AE revela
    // cero pixeles y el motor revelaba los 1920.
    _e1.subVectors(q[1], q[0])
    _nq.subVectors(q[3], q[0]).cross(_e1)
    const area = _nq.length()
    if (!(area > 1e-6)) { cerrar(planos); return }
    _nq.divideScalar(area)

    _c.set(0, 0, 0); for (const p of q) _c.add(p); _c.multiplyScalar(0.25)

    // con camara, los planos salen del OJO (piramide); sin camara el reproductor es ortografico y la
    // normal del rectangulo ES la direccion de mirada, asi que el prisma es correcto
    // EL PRISMA DESDE LA NORMAL DEL RECTANGULO, y no una piramide desde el ojo.
    //
    // Los dos son correctos en su caso: el prisma equivale a la proyeccion cuando la matte y la capa son
    // coplanares y la matte no esta girada, y la piramide seria lo general. Probe la piramide, los
    // cuatro planos dieron residuo CERO contra el ojo —o sea bien armados— y el recorte igual salio mal:
    // el ojo y las esquinas no terminan en el mismo espacio, y eso hay que MEDIRLO antes de confiarlo.
    //
    // Mientras tanto el exportador rechaza con nombre y motivo cualquier matte girada o a distinta
    // profundidad, asi que lo unico que llega hasta aca es el caso donde el prisma ES la proyeccion.
    for (let i = 0; i < 4; i++) {
      const a = q[i], b = q[(i + 1) % 4]
      _e1.subVectors(b, a)
      _n.copy(_nq)
      _n.crossVectors(_e1, _n)
      const m = _n.length()
      if (!(m > 1e-9)) { cerrar(planos); return }      // arista degenerada: la matte esta de canto
      _n.divideScalar(m)
      if (_n.dot(_tmp.copy(_c).sub(a)) < 0) _n.negate()
      planos[i].setFromNormalAndCoplanarPoint(_n, a)
    }
  }

  // EL RADIO DEL DESENFOQUE, EN UNIDADES DE TEXTURA.
  //
  // El circulo de confusion se aproxima con `apertura * |d - enfoque| / d`, que es la forma usual y es
  // dimensionalmente sana: la apertura de AE esta en pixeles y el cociente es adimensional.
  //
  // ESTO TODAVIA NO ESTA MEDIDO CONTRA AE. Se comporta bien —el plano de enfoque queda nitido y la
  // borrosidad crece con la distancia— pero que el numero COINCIDA con el de AE es otra afirmacion y
  // no la hice.
  const _cen = new THREE.Vector3()
  function radioDesenfoque(capa, malla, t) {
    const cam = camaraDoc && camaraDoc.camara
    if (!cam || !cam.conProfundidad || !capa.es3D) return 0
    _cen.copy(malla.geometry.boundingSphere.center).applyMatrix4(malla.matrix).applyMatrix4(camara.matrixWorldInverse)
    const d = -_cen.z
    if (!(d > 1)) return 0
    const T = camaraDoc.transformacion
    const enfoque = propEn(T, 'enfoque', 0, t, cam.enfoque)
    const apertura = propEn(T, 'apertura', 0, t, cam.apertura)
    const zoom = propEn(T, 'zoom', 0, t, cam.zoom)
    const coc = apertura * Math.abs(d - enfoque) / d * ((cam.difusion ?? 100) / 100)
    if (coc < 0.4) return 0
    // de pixeles de PANTALLA a unidades de TEXTURA: la textura cubre el ancho de la capa, y la capa
    // ocupa en pantalla su ancho de mundo por la magnificacion (zoom/d)
    const R = rectDe(capa)
    if (!R) return 0
    const escX = Math.abs(propEn(capa.transformacion, 'escala', 0, t, 100)) / 100
    const anchoPantalla = R * escX * zoom / d
    if (!(anchoPantalla > 1)) return 0
    return Math.min(0.25, coc / anchoPantalla)
  }
  // LA CAJA DE LA CAPA EN SUS PROPIAS COORDENADAS, que es donde vive la mascara y donde vive la UV del
  // plano. Tiene que coincidir EXACTAMENTE con la geometria o la mascara sale corrida, asi que sale de
  // los mismos datos.
  function rectDeCapa(capa) {
    // UNA FORMA VECTORIAL NO TIENE RASTER, asi que su caja sale de los propios trazados. Se toma la
    // union de TODOS los cuadros muestreados —no la del cuadro actual— porque el lienzo se reusa entre
    // cuadros: si la caja cambiara de tamano con el trazado, la textura se redimensionaria sola y la UV
    // dejaria de corresponder. Y se agranda por el grosor del trazo y sus remates.
    if (capa.forma) {
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity
      for (const P of capa.forma.partes) {
        if (P.tipo !== 'trazado') continue
        for (const [, tz] of P.trazados) {
          for (let i = 0; i < tz.v.length; i++) {
            for (const p of [tz.v[i], [tz.v[i][0] + tz.ent[i][0], tz.v[i][1] + tz.ent[i][1]],
                             [tz.v[i][0] + tz.sal[i][0], tz.v[i][1] + tz.sal[i][1]]]) {
              if (p[0] < x0) x0 = p[0]; if (p[0] > x1) x1 = p[0]
              if (p[1] < y0) y0 = p[1]; if (p[1] > y1) y1 = p[1]
            }
          }
        }
      }
      if (!isFinite(x0)) return null
      let gordo = 0
      for (const P of capa.forma.partes) {
        if (P.tipo !== 'trazo') continue
        const pista = capa.transformacion[`forma${P.orden}.grosor`]
        let mx = pista?.estatico?.[0] ?? 2
        for (const s of (pista?.pistas?.[0]?.tramos || [])) mx = Math.max(mx, s.v1, s.v2)
        gordo = Math.max(gordo, mx)
      }
      const m = gordo / 2 + 2
      return { x0: x0 - m, y0: y0 - m, x1: x1 + m, y1: y1 + m }
    }
    if (capa.solido) return { x0: 0, y0: 0, x1: capa.solido.ancho, y1: capa.solido.alto }
    if (capa.raster && !capa.forma) {
      const x0 = capa.raster.caja.x - capa.raster.margen, y0 = capa.raster.caja.y - capa.raster.margen
      return { x0, y0, x1: x0 + capa.raster.ancho, y1: y0 + capa.raster.alto }
    }
    if (capa.origen && capa.origen.copiado) {
      return { x0: 0, y0: 0, x1: capa.origen.ancho, y1: capa.origen.alto }
    }
    if (capa.caja) {
      return { x0: capa.caja.x, y0: capa.caja.y, x1: capa.caja.x + capa.caja.ancho, y1: capa.caja.y + capa.caja.alto }
    }
    return null
  }

  // el ancho de la capa en sus propias coordenadas, que es lo que cubre la textura
  function rectDe(capa) {
    if (capa.solido) return capa.solido.ancho
    if (capa.origen) return capa.origen.ancho
    if (capa.caja) return capa.caja.ancho
    return 0
  }

  // ================================================================ EL ANIMADOR, APLICADO
  //
  // Para cada caracter se compone el factor de todos los selectores del animador —con la cuenta que
  // `selector-check.mjs` verifica contra 88 configuraciones medidas en AE— y con ese factor se
  // interpola cada propiedad desde su valor base hasta el valor del animador.
  //
  // LA INTERLETRA NO SE REPARTE POR CARACTER SINO POR HUECO, y esta medido: con los diez caracteres
  // seleccionados y interletra 100 el ancho crecio 900, o sea (N-1) x 100, no N x 100. Cada hueco
  // crece con el PROMEDIO de los dos caracteres que lo rodean; por eso el primero y el ultimo pesan la
  // mitad. Repartirla por caracter daria una linea un caracter mas ancha y todo corrido medio hueco.
  const _mT = new THREE.Matrix4(), _mR = new THREE.Matrix4(), _mS = new THREE.Matrix4(), _mA = new THREE.Matrix4()
  const _col = new THREE.Color()
  function ponerCaracteres(entrada, t, dentro, opCapa) {
    const { capa, malla, piezas, colorBase } = entrada
    const n = piezas.length
    const T = capa.transformacion
    const P = (nombre, comp, def) => propEn(T, nombre, comp, t, def)

    // 1 · resolver cada animador a esta altura del tiempo
    const anims = []
    for (const A of capa.animadores) {
      const sels = A.selectores.map(s => ({
        unidades: s.unidades, forma: s.forma, modo: s.modo,
        inicio: P(`anim${A.indice}sel${s.indice}.inicio`, 0, 0),
        fin: P(`anim${A.indice}sel${s.indice}.fin`, 0, s.unidades === 2 ? n : 100),
        desplazamiento: P(`anim${A.indice}sel${s.indice}.desplazamiento`, 0, 0),
        cantidadMaxima: P(`anim${A.indice}sel${s.indice}.cantidadMaxima`, 0, 100),
        easeAlto: P(`anim${A.indice}sel${s.indice}.easeAlto`, 0, 0),
        easeBajo: P(`anim${A.indice}sel${s.indice}.easeBajo`, 0, 0),
        suavidad: P(`anim${A.indice}sel${s.indice}.suavidad`, 0, s.suavidad),
      }))
      const val = {}
      for (const pv of A.propiedades) {
        const base = `anim${A.indice}.val.${pv.nombre}`
        val[pv.nombre] = pv.dims > 1
          ? [P(base, 0, 0), P(base, 1, 0), P(base, 2, 0)]
          : P(base, 0, 0)
      }
      anims.push({ sels, val })
    }

    // 2 · el factor de cada caracter, y de ahi su transformacion
    const trac = new Array(n).fill(0)
    const est = []
    for (let k = 0; k < n; k++) {
      let dx = 0, dy = 0, sx = 1, sy = 1, rot = 0, opa = 1, ax = 0, ay = 0
      _col.copy(colorBase)
      for (const A of anims) {
        const f = factorCompuesto(A.sels, k, n)
        if (!f) continue
        const v = A.val
        if (v['ADBE Text Position 3D']) { dx += f * v['ADBE Text Position 3D'][0]; dy += f * v['ADBE Text Position 3D'][1] }
        if (v['ADBE Text Anchor Point 3D']) { ax += f * v['ADBE Text Anchor Point 3D'][0]; ay += f * v['ADBE Text Anchor Point 3D'][1] }
        if (v['ADBE Text Scale 3D']) {
          sx *= 1 + f * (v['ADBE Text Scale 3D'][0] / 100 - 1)
          sy *= 1 + f * (v['ADBE Text Scale 3D'][1] / 100 - 1)
        }
        if (v['ADBE Text Rotation'] !== undefined) rot += f * v['ADBE Text Rotation']
        if (v['ADBE Text Opacity'] !== undefined) opa *= 1 + f * (v['ADBE Text Opacity'] / 100 - 1)
        if (v['ADBE Text Tracking Amount'] !== undefined) trac[k] += f * v['ADBE Text Tracking Amount']
        if (v['ADBE Text Fill Color']) {
          const c = v['ADBE Text Fill Color']
          _col.setRGB(_col.r + f * (c[0] - _col.r), _col.g + f * (c[1] - _col.g), _col.b + f * (c[2] - _col.b))
        }
      }
      est.push({ dx, dy, sx, sy, rot, opa, ax, ay, r: _col.r, g: _col.g, b: _col.b })
    }

    // 3 · el corrimiento acumulado de la interletra, hueco por hueco
    let corrido = 0
    for (let k = 0; k < n; k++) {
      if (k > 0) corrido += (trac[k - 1] + trac[k]) / 2
      est[k].corrido = corrido
    }

    // 4 · aplicar
    for (let k = 0; k < n; k++) {
      const pz = piezas[k]
      if (!pz.malla) continue
      const e = est[k]
      // EL PIVOTE MEDIDO: centro del avance, sobre la linea de base. Y el corrimiento de la
      // interletra va SOLO en la traslacion de ida: si estuviera tambien en la de vuelta se
      // cancelarian y la interletra del animador no movería un pixel — que es lo que pasaba.
      const px = pz.x + pz.avance / 2
      const py = 0
      _mT.makeTranslation(px + e.corrido + e.dx, py + e.dy, 0)
      _mR.makeRotationZ(e.rot * Math.PI / 180)
      _mS.makeScale(e.sx || 1e-6, e.sy || 1e-6, 1)
      _mA.makeTranslation(-(px + e.ax), -(py + e.ay), 0)
      pz.malla.matrix.copy(_mT).multiply(_mR).multiply(_mS).multiply(_mA)
      pz.malla.matrixWorld.multiplyMatrices(malla.matrixWorld, pz.malla.matrix)
      const o = dentro ? Math.max(0, Math.min(100, opCapa)) / 100 * Math.max(0, Math.min(1, e.opa)) : 0
      pz.mat.opacity = o
      pz.mat.visible = o > 0.0005
      pz.mat.color.setRGB(e.r, e.g, e.b)
    }
  }

  function poner(t) {
    matrices.clear()
    ponerCamara(t)
    const estado = {}
    for (const entrada of capas) {
      const { capa, malla, mat } = entrada
      const M = matrizDe(capa.indice, t)
      if (!malla) continue
      // Φ · M en un solo paso: del espacio de la capa (coordenadas de AE) al mundo de three
      malla.matrix.copy(PHI).multiply(M)
      malla.matrixWorld.copy(malla.matrix)
      // el punto de salida de AE es EXCLUSIVO: una capa que sale en 4,80 s no se ve en el cuadro 144
      const dentro = t >= capa.entra - 1e-9 && t < capa.sale - 1e-9 && capa.visible
      const op = propEn(capa.transformacion, 'opacidad', 0, t, 100)
      mat.opacity = dentro ? Math.max(0, Math.min(100, op)) / 100 : 0
      mat.visible = mat.opacity > 0.0005
      // UNA CAPA QUE HACE DE MATTE NO SE DIBUJA. En AE tampoco: se usa su forma y desaparece.
      if (capa.esMatte) mat.visible = false
      if (capa.matte && mat.clippingPlanes) ponerRecorte(capa, mat.clippingPlanes, t)
      if (mat.userData.focoUni) mat.userData.focoUni.uRadio.value = radioDesenfoque(capa, malla, t)
      if (capa.arco && mat.userData.arcoUni) {
        const T2 = capa.transformacion
        const desfase = propEn(T2, 'arcoDesfase', 0, t, 0) / 360
        mat.userData.arcoUni.uDesde.value = propEn(T2, 'arcoDesde', 0, t, 0) / 100 + desfase
        mat.userData.arcoUni.uHasta.value = propEn(T2, 'arcoHasta', 0, t, 100) / 100 + desfase
      }
      if (entrada.piezas) ponerCaracteres(entrada, t, dentro, op)
      // UNA MASCARA ANIMADA SE REHACE UNA VEZ POR CUADRO, NO POR SUBMUESTRA. El trazado viaja
      // muestreado por cuadro, asi que entre las 16 submuestras del obturador no cambia: rasterizarlo
      // en cada una seria tirar quince rasterizaciones.
      // LA FORMA SE REDIBUJA UNA VEZ POR CUADRO. Igual que la mascara: entre las 16 submuestras del
      // obturador ni el trazado muestreado ni el recorte cambian de cuadro, asi que rasterizar en cada
      // una seria tirar quince rasterizaciones. El recorte SI se mueve dentro del cuadro, pero su
      // valor se toma en el instante del cuadro para que las dos cosas queden en el mismo tiempo.
      if (entrada.forma) {
        const k = Math.round(t * fps)
        if (k !== entrada.forma.cuadro) {
          entrada.forma.cuadro = k
          texturaDeForma(capa, entrada.forma.rect, k, entrada.forma.lienzo)
          entrada.forma.tex.needsUpdate = true
        }
      }
      if (entrada.mascara && entrada.mascara.animada) {
        const k = Math.round(t * fps)
        if (k !== entrada.mascara.cuadro) {
          entrada.mascara.cuadro = k
          texturaDeMascara(capa, entrada.mascara.rect, k, entrada.mascara.lienzo)
          entrada.mascara.tex.needsUpdate = true
        }
      }
      // EL ESTADO SE INFORMA EN LAS MISMAS CLAVES QUE EL REPRODUCTOR ANTERIOR, a propósito: es lo que
      // permite comparar la reescritura contra las mediciones que ya existen. Un formato distinto
      // habría dado NaN en la columna de geometría y habría parecido un defecto del 3D.
      const T = capa.transformacion
      estado[capa.indice] = {
        ax: propEn(T, 'anclaje', 0, t, 0), ay: propEn(T, 'anclaje', 1, t, 0),
        px: capa.separadas ? propEn(T, 'posX', 0, t, 0) : propEn(T, 'posicion', 0, t, 0),
        py: capa.separadas ? propEn(T, 'posY', 0, t, 0) : propEn(T, 'posicion', 1, t, 0),
        sx: propEn(T, 'escala', 0, t, 100), sy: propEn(T, 'escala', 1, t, 100),
        rot: propEn(T, 'rotacion', 0, t, 0), op,
      }
    }
    ordenarPorProfundidad()
    dibujar()
    return estado
  }

  window.__dur = duracion
  window.__fps = fps
  window.__sinSoporte = sinSoporte
  window.__poner = poner
  // LAS CUATRO ESQUINAS DE CADA CAPA, YA PROYECTADAS A PIXELES DE PANTALLA.
  //
  // Existe para que la métrica de ritmo pueda COMPROBARSE contra el motor de verdad. La métrica
  // recalcula la misma cadena (evaluar la propiedad, armar la matriz, proyectar) en Node, sin
  // navegador — es lo que la hace barata. El riesgo de eso es conocido y este repo ya lo pagó: dos
  // implementaciones de la misma cuenta divergen en silencio, y entonces la métrica mide una pieza que
  // nadie va a ver. Con esto la divergencia se mide en vez de suponerse.
  window.__esquinas = function (t) {
    poner(t)
    camara2D.updateMatrixWorld()
    const r = {}
    const v = new THREE.Vector3()
    for (const { capa, malla, enElMundo } of capas) {
      if (!malla) continue
      // EN ORDEN CICLICO, no en el que las guarda `PlaneGeometry`. three las entrega en zigzag
      // (arriba-izq, arriba-der, abajo-izq, abajo-der) porque las consume como dos triángulos; para
      // comparar un cuadrilátero —y para calcularle el área— hay que recorrerlo por el borde. Con el
      // zigzag, dos de las cuatro esquinas quedan cruzadas y la comparación informa 2200 px de error
      // sin que haya ningún error. Es lo que reportó la primera corrida de la comprobación.
      const g = malla.geometry.attributes.position
      const pts = []
      for (const k of [2, 3, 1, 0]) {
        v.fromBufferAttribute(g, k).applyMatrix4(malla.matrix).project(enElMundo ? camara : camara2D)
        pts.push([(v.x + 1) / 2 * ancho, (1 - v.y) / 2 * alto])
      }
      r[capa.indice] = pts
    }
    return r
  }
  // LOS PLANOS DE RECORTE, PARA PODER MIRARLOS. Igual que `__cajas`: una funcion geometrica equivocada
  // no da error, da numeros, y sin poder leerlos la unica forma de depurar es adivinar.
  window.__planos = function () {
    const r = {}
    for (const { capa, mat } of capas) {
      if (!capa.matte || !mat || !mat.clippingPlanes) continue
      // EL RESIDUO DEL OJO es la comprobacion que importa: si los planos forman una piramide desde el
      // ojo, entonces n.ojo + d TIENE que dar cero en los cuatro. Cualquier otro numero dice que los
      // planos son de otra figura, y ahi no hay nada que interpretar mirando el cuadro.
      r[capa.nombre] = {
        recorteLocal: render.localClippingEnabled,
        ojo: [+ojoMundo.x.toFixed(1), +ojoMundo.y.toFixed(1), +ojoMundo.z.toFixed(1)],
        planos: mat.clippingPlanes.map(p => ({
          n: [+p.normal.x.toFixed(3), +p.normal.y.toFixed(3), +p.normal.z.toFixed(3)],
          d: +p.constant.toFixed(1),
          residuoOjo: +(p.normal.dot(ojoMundo) + p.constant).toFixed(2),
        })),
      }
    }
    return r
  }

  // EL ORDEN DE DIBUJO QUE EL MOTOR USO DE VERDAD, para poder contrastarlo contra el que CALCULA.
  // No es lo mismo: una cosa es la profundidad que sale de la cuenta y otra el `renderOrder` que
  // termina en la escena, y entre las dos hay tres o cuatro lugares donde se puede perder.
  window.__orden = function (t) {
    poner(t)
    return capas.filter(c => c.malla).map(c => ({
      nombre: c.capa.nombre, indice: c.capa.indice,
      profundidad: c.profundidad === undefined ? null : c.profundidad,
      renderOrder: c.malla.renderOrder,
      enElMundo: !!c.enElMundo,
      visible: c.mat ? c.mat.visible : null,
    })).sort((a, b) => a.renderOrder - b.renderOrder)
  }

  window.__cajas = function () {
    const r = {}
    for (const { capa } of capas) {
      if (!capa.texto) continue
      const medidor = document.createElement('canvas').getContext('2d')
      const tg = capa.texto.tipografia
      medidor.font = `${tg.cursiva ? 'italic ' : ''}${tg.peso} ${capa.texto.tamano}px "${tg.ps}", "${tg.familia}", sans-serif`
      // la misma interletra que en el dibujo: esta es la caja contra la que compara `comp-check`
      medidor.letterSpacing = capa.texto.interletra ? (capa.texto.tamano * capa.texto.interletra / 1000) + 'px' : '0px'
      const m = medidor.measureText(capa.texto.contenido)
      r[capa.indice] = {
        ancho: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
        alto: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
        tinta: {
          ancho: m.actualBoundingBoxLeft + m.actualBoundingBoxRight,
          alto: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent,
          avance: m.width,
        },
      }
    }
    return r
  }

  // LA CAJA DE TINTA DE UN TEXTO ANIMADO, EN UN INSTANTE DADO.
  //
  // `__cajas` mide la cadena quieta, que para un animador no dice nada: la caja cambia en cada cuadro
  // porque las letras se mueven, escalan y rotan. Esta devuelve la union de las cajas de los caracteres
  // VISIBLES, ya transformadas, en coordenadas de la capa — que es exactamente lo que
  // `sourceRectAtTime` mide del lado de AE. Con eso las dos se pueden comparar cuadro a cuadro.
  //
  // DOS COSAS QUE ASUMI MAL Y QUE LA PROPIA COMPUERTA REFUTO EN SU PRIMERA CORRIDA:
  //
  // 1. "AE tampoco cuenta la tinta invisible". FALSO. `sourceRectAtTime` IGNORA LA OPACIDAD: en el
  //    tecleo, con las letras al 0%, AE informa 769,1 px de ancho en todos los cuadros, constante. Asi
  //    que aca se cuentan TODOS los caracteres — si se filtrara por opacidad se estarian comparando dos
  //    magnitudes distintas y el rojo no significaria nada.
  // 2. Medir los vertices del PLANO. Cada glifo se dibuja en un lienzo con margen (0,3 del cuerpo por
  //    lado) para que no se corte el antialias, y ese margen entraba en la caja: 56 px de mas sobre un
  //    cuerpo de 92, o sea "alto AE 69,2 contra motor 125,0" en TODAS las capas. Se transforman las
  //    cuatro esquinas de la TINTA, que es lo que mide AE.
  const _v4 = new THREE.Vector3()
  window.__cajasAnimadas = function (t) {
    poner(t)
    const r = {}
    for (const entrada of capas) {
      if (!entrada.piezas) continue
      let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity, vistos = 0
      for (const pz of entrada.piezas) {
        if (!pz.malla || !pz.tieneTinta) continue
        vistos++
        // las cuatro esquinas de la tinta del glifo, en coordenadas de la capa
        const ex = [pz.x + pz.izq, pz.x + pz.der], ey = [pz.arr, pz.aba]
        for (let a = 0; a < 2; a++) for (let b2 = 0; b2 < 2; b2++) {
          _v4.set(ex[a], ey[b2], 0).applyMatrix4(pz.malla.matrix)
          if (_v4.x < x0) x0 = _v4.x
          if (_v4.x > x1) x1 = _v4.x
          if (_v4.y < y0) y0 = _v4.y
          if (_v4.y > y1) y1 = _v4.y
        }
      }
      r[entrada.capa.indice] = vistos
        ? { x: x0, y: y0, ancho: x1 - x0, alto: y1 - y0, caracteres: vistos }
        : { x: 0, y: 0, ancho: 0, alto: 0, caracteres: 0 }
    }
    return r
  }

  // NADA SE DECLARA LISTO HASTA QUE LAS TEXTURAS ESTAN. Sin esta espera los primeros cuadros salen
  // con las imagenes en blanco: no hay error, no hay aviso, hay unos cuadros vacios al principio.
  if (pendientes.length) {
    try { await Promise.all(pendientes) } catch (e) { sinSoporte.push(`no cargo un medio: ${e}`) }
  }
  poner(0)
  document.title = 'listo'
})()
</script>
