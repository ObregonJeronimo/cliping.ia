<!doctype html>
<meta charset="utf-8">
<title>BOVEDA · plantillas completas</title>
<style>
  /* Mismas caras que el motor de escenas y por la misma razon: el canvas MIDE con la fuente que haya
     en el momento de rasterizar, y la textura queda cacheada. Una fuente que llega tarde no se ve
     mal — se ve con OTRA tipografia, para siempre, y recien en el video terminado. */
  @font-face { font-family: "Anton";        src: url("/fonts/Anton-400.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "ArchivoBlack"; src: url("/fonts/ArchivoBlack-400.ttf") format("truetype"); font-weight: 400; font-display: block; }
  @font-face { font-family: "BigShoulders"; src: url("/fonts/BigShouldersDisplay-900.ttf") format("truetype"); font-weight: 900; font-display: block; }
  @font-face { font-family: "Bricolage";    src: url("/fonts/BricolageGrotesque-800.ttf") format("truetype"); font-weight: 800; font-display: block; }
  @font-face { font-family: "DMSans";       src: url("/fonts/DMSans-500.ttf") format("truetype"); font-weight: 500; font-display: block; }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  canvas { display: block; }
</style>
<!-- #c dibuja WebGL y vive FUERA de pantalla; #acc promedia las submuestras del obturador y es el que
     se graba. Con los dos visibles la captura agarraria los dos. -->
<canvas id="c" style="position:absolute;left:-99999px;top:0"></canvas>
<canvas id="acc"></canvas>
<script src="/gsap.min.js"></script>
